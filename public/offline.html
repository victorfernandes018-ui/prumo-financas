<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090c" />
<title>Sem conexão · Prumo</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; background: #f6f6f8; color: #0c0c10; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #09090c; color: #f5f5f7; } p { color: #9a9aa6 !important; } }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #6b6b76; font-size: 15px; line-height: 1.5; max-width: 320px; margin: 0 auto; }
  button { margin-top: 24px; background: #5b5cf0; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Prumo" />
    <h1>Você está sem internet</h1>
    <p>Por segurança, seus dados financeiros não ficam guardados no aparelho. Conecte-se para continuar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
